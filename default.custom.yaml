# default.custom.yaml
# 个人定制补丁：覆盖 default.yaml 的默认配置，不修改仓库原文件
# 作者推荐方式：见 https://github.com/iDvel/rime-ice README「修改雾凇拼音的配置」一节
# 放在 ~/Library/Rime/ 下，重新部署鼠须管即可生效

patch:
  # ============================================================
  # 方案列表：只启用雾凇拼音（全拼），关闭 t9 与所有双拼方案
  # 想要恢复某个方案，把对应一行取消注释并重新部署即可
  # ============================================================
  schema_list:
    - schema: rime_ice               # 雾凇拼音（全拼）
    # - schema: t9                     # 中文九键
    # - schema: double_pinyin          # 自然码双拼
    # - schema: double_pinyin_abc      # 智能 ABC 双拼
    # - schema: double_pinyin_mspy     # 微软双拼
    # - schema: double_pinyin_sogou     # 搜狗双拼
    # - schema: double_pinyin_flypy    # 小鹤双拼
    # - schema: double_pinyin_ziguang  # 紫光双拼
    # - schema: double_pinyin_jiajia   # 拼音加加双拼

  # ============================================================
  # 方案选单：呼出热键改为 Control+\（替换上游的 F4 / Control+grave）
  # ============================================================
  switcher/hotkeys:
    - Control+backslash

  # 方案选单：单方案时展开选项更直观
  switcher/fold_options: false
  switcher/abbreviate_options: false

  # ============================================================
  # 中西文切换键
  #   Caps_Lock  → commit_code（上屏编码并切英文）
  #   Shift_L    → noop（不切换，避免误触）
  #   Shift_R    → inline_ascii（临时英文，回车确认）
  # 注意：Rime 按键绑定中 accept/send 较敏感，整体覆盖最稳妥
  # ============================================================
  ascii_composer/switch_key/Caps_Lock: commit_code
  ascii_composer/switch_key/Shift_L: noop
  ascii_composer/switch_key/Shift_R: inline_ascii

  # ============================================================
  # 按键绑定（整体覆盖上游 key_binder/bindings）
  # 与上游相比的变化：
  #   - Tab / Shift+Tab 改为翻页（原为切光标到下/上一个拼音）
  #   - 关闭 Alt+←/→ 切光标
  #   - 新增 Control+grave 切换中英
  #   - 关闭 Control+Shift+3/4 标点与简繁切换
  #   - 启用 emacs_editing 风格行内编辑（Control+b/f/p/n 等）
  #   - 关闭小键盘 KP_* 映射
  # ============================================================
  key_binder/bindings:
    # Tab / Shift+Tab 翻页
    - { when: has_menu, accept: Shift+Tab, send: Page_Up }
    - { when: has_menu, accept: Tab, send: Page_Down }

    # 翻页 - =
    - { when: has_menu, accept: minus, send: Page_Up }
    - { when: has_menu, accept: equal, send: Page_Down }

    # 切换中英
    - { when: always, toggle: ascii_mode, accept: Control+grave }

    # emacs_editing：行内编辑（composing 时生效），标准 emacs 方向键
    - { when: composing, accept: Control+p, send: Up }
    - { when: composing, accept: Control+n, send: Down }
    - { when: composing, accept: Control+b, send: Left }
    - { when: composing, accept: Control+f, send: Right }
    - { when: composing, accept: Control+a, send: Home }
    - { when: composing, accept: Control+e, send: End }
    - { when: composing, accept: Control+d, send: Delete }
    - { when: composing, accept: Control+k, send: Shift+Delete }
    - { when: composing, accept: Control+h, send: BackSpace }
    - { when: composing, accept: Control+g, send: Escape }
    - { when: composing, accept: Control+bracketleft, send: Escape }