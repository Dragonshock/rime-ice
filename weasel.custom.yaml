# weasel.custom.yaml
# 放到小狼毫用户目录 %APPDATA%\Rime\weasel.custom.yaml
# 保存后重新部署即可生效
# 基于 macOS squirrel.custom.yaml 配置移植

patch:
  # ------------------------------
  # 常用 app：默认英文
  # ------------------------------
  "app_options/windowsterminal.exe/ascii_mode": true
  "app_options/wt.exe/ascii_mode": true
  "app_options/cmd.exe/ascii_mode": true
  "app_options/powershell.exe/ascii_mode": true
  "app_options/pwsh.exe/ascii_mode": true
  "app_options/wezterm-gui.exe/ascii_mode": true
  "app_options/emacs.exe/ascii_mode": true
  "app_options/eudic.exe/ascii_mode": true

  # ------------------------------
  # 主题选择（跟随系统明暗自动切换，需 Windows 10 1809+）
  # ------------------------------
  "style/color_scheme": "apple-mist-light-sage"
  "style/color_scheme_dark": "apple-mist-dark-sky"

  # ------------------------------
  # 面板布局
  # ------------------------------
  "style/inline_preedit": true
  "style/preedit_type": composition
  "style/horizontal": true
  "style/label_format": "%s."

  # ------------------------------
  # 字体（需在 Windows 上安装 Source Code Pro 和 LXGW WenKai Mono TC）
  # 若未安装 LXGW WenKai，会 fallback 到 Microsoft YaHei
  # ------------------------------
  "style/font_face": "Source Code Pro, LXGW WenKai Mono TC, Microsoft YaHei"
  "style/label_font_face": "Source Code Pro, LXGW WenKai Mono TC, Microsoft YaHei"
  "style/comment_font_face": "Source Code Pro, LXGW WenKai Mono TC, Microsoft YaHei"
  "style/font_point": 12
  "style/label_font_point": 12
  "style/comment_font_point": 12

  # ------------------------------
  # 间距与圆角
  # ------------------------------
  "style/layout/border_width": 1
  "style/layout/margin_x": 14
  "style/layout/margin_y": 9
  "style/layout/spacing": 8
  "style/layout/candidate_spacing": 12
  "style/layout/hilite_spacing": 5
  "style/layout/hilite_padding": 6
  "style/layout/min_width": 7
  "style/layout/corner_radius": 13
  "style/layout/round_corner": 10
  "style/layout/shadow_radius": 0

  # ------------------------------
  # Apple Mist 配色（从 macOS squirrel.custom.yaml 移植）
  # 颜色格式为 rgba (0xRRGGBBAA)，需要 Weasel 0.16+
  # ------------------------------

  "preset_color_schemes/apple-mist-light-sage":
    author: yester-code
    name: "Apple Mist Light Sage"
    color_format: rgba
    back_color: 0xF5F6F7D9
    border_color: 0xFFFFFF66
    shadow_color: 0x0000001C
